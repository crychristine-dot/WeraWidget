name: Vera
options:
  bundleIdPrefix: com.kriscarter
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Vera:
    type: application
    platform: iOS
    sources:
      - path: VeraApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kriscarter.vera
        INFOPLIST_KEY_CFBundleDisplayName: "Тихий свет"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: VeraApp/Vera.entitlements
    dependencies:
      - target: VeraWidget
        embed: true
  VeraWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: VeraWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kriscarter.vera.widget
        INFOPLIST_KEY_CFBundleDisplayName: "Vera Widget"
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: VeraWidget/VeraWidget.entitlements
