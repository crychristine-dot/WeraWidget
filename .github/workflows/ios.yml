
name: Build WeraWidget IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project Vera.xcodeproj \
            -scheme Vera \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Vera.app Payload/
          cd Payload/..
          zip -r WeraWidget.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WeraWidget-IPA
          path: WeraWidget.ipa
          if-no-files-found: error
