
name: Build WeraWidget IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          cd VeraApp
          xcodegen generate

      - name: Build
        run: |
          cd VeraApp
          xcodebuild \
            -project Vera.xcodeproj \
            -scheme Vera \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R VeraApp/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r WeraWidget.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: WeraWidget-IPA
          path: WeraWidget.ipa
